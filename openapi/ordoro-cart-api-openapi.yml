    cart_sps_commerce_vendor_config:
      type: object
      definitions:
        required_to_create:
          required:
          - host
          - port
          - username
          - password
        required_in_response:
          required:
          - host
          - port
          - username
          - password
      description: SPS Commerce configuration information
      properties:
        host:
          type: string
        port:
          type: string
        username:
