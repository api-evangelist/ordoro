openapi: 3.2.0
info:
  title: Ordoro API Documentation Company API
  description: '# Introduction


    The Ordoro API can be used to access data or integrate to add functionality to Ordoro.'
  contact: {}
  version: '1.0'
servers:
- url: https://api.ordoro.com/
  variables: {}
tags:
- name: Company
  description: ''
paths:
  /company/:
    get:
      tags:
      - Company
      summary: Get Your Company Info
      description: ''
      operationId: Company_GET
      parameters: []
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/company'
      deprecated: false
    put:
      tags:
      - Company
      summary: Update Your Company
      description: ''
      operationId: Company_PUT
      parameters: []
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/company'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/put_company'
      deprecated: false
  /company/logo/:
    get:
      tags:
      - Company
      summary: Get Company Logo
      description: ''
      operationId: CompanyLogo_GET
      parameters: []
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/company_logo'
      deprecated: false
  /company/logo/{name}/:
    get:
      tags:
      - Company
      summary: Get Company Logo by Name
      description: ''
      operationId: CompanyLogoByName_GET
      parameters:
      - name: name
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/company_logo'
      deprecated: false
    put:
      tags:
      - Company
      summary: Update Company Logo by Name
      description: ''
      operationId: CompanyLogoByName_PUT
      parameters:
      - name: name
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/company_logo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/put_company_logo'
      deprecated: false
  /company/{company_id}/logo/{name}/:
    get:
      tags:
      - Company
      summary: Get company logo by company ID and logo name
      description: ''
      operationId: CompanyLogoByCompanyIdAndName_GET
      parameters:
      - name: company_id
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: string
      - name: name
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/company_logo'
      deprecated: false
  /company/{company_id}/logo/{name}/raw/:
    get:
      tags:
      - Company
      summary: Get raw logo image by company ID and logo name
      description: The `name` parameter is the name of your company logo.
      operationId: CompanyLogoRawByCompanyIdAndName_GET
      parameters:
      - name: company_id
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: string
      - name: name
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: ''
          headers: {}
      deprecated: false
components:
  schemas:
    put_company_logo:
      title: PUT Company Logo Schema
      additionalProperties: false
      type: object
      properties:
        name:
          type: string
          example: Your Cool Company
        data:
          type: string
          example: 
        mime_type:
          type: string
          example: image/png
    company_logo:
      title: Company Logo Response Schema
      additionalProperties: false
      type: object
      properties:
        _link:
          type: string
        company_id:
          type: integer
        data:
          type: string
          example: 
        name:
          type: string
        mime_type:
          type: string
          example: image/png
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
    company:
      title: Company Schema
      type: object
      properties:
        _link:
          type: string
        id:
          type: integer
        name:
          type: string
        contact:
          type: string
        address:
          type: string
        website:
          type: string
        phone:
          type: string
        fax:
          type: string
        email:
          type: string
        billing_email:
          type: string
        currency_symbol:
          type: string
        created:
          type: string
          format: date-time
        features:
          type: object
        stripe_customer_id:
          type: string
        shipper_currency:
          type: string
        footer:
          type: string
        mail_sender:
          type: string
        activated:
          type: string
          format: date-time
        deactivated:
          type: string
          format: date-time
        plan:
          type: string
        pitney_rate_type:
          type: string
        autosync_frequency:
          type: string
        app_message:
          type: string
        api_locked:
          type: boolean
        print_node:
          type: object
        vendor_connect:
          type: boolean
        payment_details:
          type: object
        trusted:
          anyOf:
          - type: 'null'
          - type: boolean
    put_company:
      title: Address Schema
      type: object
      additionalProperties: false
      properties:
        company_name:
          type: string
        contact:
          type: string
        address:
          type: string
        website:
          type: string
        phone:
          type: string
        fax:
          type: string
        email:
          type: string
        billing_email:
          type: string
        footer:
          type: string
        mail_sender:
          type: string
        shipper_currency:
          type: string
        currency_symbol:
          type: string
