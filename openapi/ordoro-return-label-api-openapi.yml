openapi: 3.2.0
info:
  title: Ordoro API Documentation Return Label API
  description: '# Introduction


    The Ordoro API can be used to access data or integrate to add functionality to Ordoro.'
  contact: {}
  version: '1.0'
servers:
- url: https://api.ordoro.com/
  variables: {}
tags:
- name: Return Label
  description: ''
paths:
  /return_label/:
    get:
      tags:
      - Return Label
      summary: Get a list of Return Labels
      description: Get a list of return labels by using the `s` parameter for shipments
      operationId: ReturnLabel_GET
      parameters:
      - name: s
        in: query
        description: ''
        style: form
        explode: true
        schema:
          type: string
      - name: type
        in: query
        description: ''
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/type2'
      - name: default
        in: query
        description: ''
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/default'
      - name: page_width
        in: query
        description: ''
        required: true
        style: form
        explode: true
        schema:
          type: number
          format: double
      - name: page_height
        in: query
        description: ''
        required: true
        style: form
        explode: true
        schema:
          type: number
          format: double
      - name: orientation
        in: query
        description: ''
        style: form
        explode: true
