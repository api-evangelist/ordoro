        '200':
          description: ''
          headers: {}
      deprecated: true
  /return_label/{label_id}/raw/:
    get:
      tags:
      - Return Label
      summary: Get a raw label image
      description: Get a raw label image by label id
      operationId: ReturnLabelRawByLabelId_GET
      parameters:
      - name: label_id
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: ''
          headers: {}
      deprecated: false
components:
  schemas:
    rotation:
      title: rotation
      enum:
      - 0
      - 90
      - 180
      - 270
      type: integer
      example: 0
    default:
      title: default
      enum:
      - desktop
      - thermal
      type: string
    orientation:
      title: orientation
      enum:
      - portrait
      - landscape
      type: string
    type2:
      title: type2
      enum:
      - single_page
      - additional_docs
      - multi_page
      - canada_pdf
      type: string
