      - $ref: '#/components/schemas/cart_walmart_definitions-required_in_response'
    cart_volusion_v1_vendor_config_definitions-required_to_create:
      required:
      - username
      - encrypted_password
    cart_sps_commerce-2:
      title: SPS Commerce Cart
      allOf:
      - $ref: '#/components/schemas/cart_sps_commerce'
