        schema:
          type: number
          format: double
      - name: height
        in: query
        description: ''
        required: true
        style: form
        explode: true
        schema:
          type: number
          format: double
      - name: rotation
        in: query
        description: ''
        required: true
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/rotation'
      responses:
        '200':
          description: ''
          headers: {}
      deprecated: true
  /return_label/pdf/:
    get:
      tags:
      - Return Label
      summary: Get return label PDFs
      description: Get a list of return label PDFs by type and shipment
      operationId: ReturnLabelPdf_GET
